name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, doc/docs-reorganization]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enlaces internos docs
        run: python docs/check-internal-links.py
