name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contratos de eventos (si existen)
        run: |
          if [ -f contracts/validate_event_schemas.py ]; then
            python contracts/validate_event_schemas.py
          else
            echo "Sin contracts/validate_event_schemas.py — OK"
          fi
      - name: Enlaces internos docs (si existen)
        run: |
          if [ -f docs/check-internal-links.py ]; then
            python docs/check-internal-links.py
          else
            echo "Sin docs/check-internal-links.py — OK"
          fi
