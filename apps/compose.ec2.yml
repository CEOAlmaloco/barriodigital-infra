# Compose plano para la EC2 (todo bajo ~/barriodigital)
name: barriodigital-apps

services:
  notify:
    build:
      context: ./ms-barriodigital-notify
      dockerfile: Dockerfile
    container_name: bd-notify
    expose:
      - "8083"
    environment:
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:?Definir endpoint privado de EC2-MQ}
      RABBIT_USER: ${RABBIT_USER:-barriodigital}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Definir RABBIT_PASSWORD}
      CERTIFICATE_OUTPUT_DIR: /app/data/certificates
      EMAIL_MODE: ${EMAIL_MODE:-logging}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      SMTP_CONNECTION_TIMEOUT: ${SMTP_CONNECTION_TIMEOUT:-5000}
      SMTP_READ_TIMEOUT: ${SMTP_READ_TIMEOUT:-5000}
      SMTP_WRITE_TIMEOUT: ${SMTP_WRITE_TIMEOUT:-5000}
    volumes:
      - certificates:/app/data/certificates
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://localhost:8083/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  mq-admin:
    build:
      context: ./ms-barriodigital-mq-admin
      dockerfile: Dockerfile
    container_name: bd-mq-admin
    expose:
      - "8084"
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:?Definir IP privada de EC2-MQ}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBIT_USER:-barriodigital}
      RABBITMQ_PASSWORD: ${RABBIT_PASSWORD:?Definir RABBIT_PASSWORD}
      RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:?Definir URL del Management}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    restart: unless-stopped

  requests:
    build:
      context: ./ms-barriodigital-requests
      dockerfile: Dockerfile
    container_name: bd-requests
    ports:
      - "8081:8081"
    environment:
      ORACLE_URL: ${ORACLE_URL}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_WALLET_DIR: /wallet
      RABBIT_ADDRESSES: ${RABBIT_ADDRESSES:?Definir endpoint privado de EC2-MQ}
      RABBIT_USER: ${RABBIT_USER:-barriodigital}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Definir RABBIT_PASSWORD}
    volumes:
      - ./wallet:/wallet:ro
    depends_on:
      notify:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    build:
      context: ./ms-barriodigital-catalog
      dockerfile: Dockerfile
    container_name: bd-catalog
    expose:
      - "8082"
    environment:
      ORACLE_URL: ${ORACLE_URL}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_WALLET_DIR: /wallet
    volumes:
      - ./wallet:/wallet:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  bff:
    build:
      context: ./ms-barriodigital-bff
      dockerfile: Dockerfile
    container_name: bd-bff
    ports:
      - "8080:8080"
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES}
      REQUESTS_BASE_URL: http://requests:8081
      CATALOG_BASE_URL: http://catalog:8082
      MQ_ADMIN_BASE_URL: ${MQ_ADMIN_BASE_URL:-http://mq-admin:8084}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      requests:
        condition: service_started
      catalog:
        condition: service_healthy
    restart: unless-stopped

volumes:
  certificates:
