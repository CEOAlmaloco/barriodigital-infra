# BarrioDigital — BFF + requests en una EC2
# Uso:
#   docker compose --env-file .env up -d --build
#
# Requiere:
#   - .env junto a este archivo (no subir a git)
#   - carpeta ./wallet con el Autonomous wallet descomprimido

name: barriodigital-apps

services:
  requests:
    build:
      context: ../../ms-barriodigital-requests
      dockerfile: Dockerfile
    container_name: bd-requests
    ports:
      - "8081:8081"
    environment:
      ORACLE_URL: ${ORACLE_URL}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_WALLET_DIR: /wallet
    volumes:
      - ${WALLET_HOST_PATH:-./wallet}:/wallet:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  bff:
    build:
      context: ../../ms-barriodigital-bff
      dockerfile: Dockerfile
    container_name: bd-bff
    ports:
      - "8080:8080"
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_AUDIENCES: ${AZURE_AUDIENCES}
      REQUESTS_BASE_URL: http://requests:8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      - requests
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
